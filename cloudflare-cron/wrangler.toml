name = "govee-lights-cron"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# GOVEE_API_KEY is set as a secret

[triggers]
crons = [
  "0 6-9,13-14 * * *",    # Hourly checks covering MDT (UTC-6) and MST (UTC-7); worker acts on Denver hour:
                          # 0 table lamp off, 1 all off except busted lamp, 2 busted lamp off, 7 busted lamp on
  "*/15 21-23,0-2 * * *"  # 3PM-7PM Denver (covers both MDT and MST) - check sunset
]
